<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bankgen</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏦</text></svg>">
    <style>
        /* Every colour in the sheet comes from a token here, so the dark theme is
           a matter of redefining the tokens rather than duplicating rules. The
           light values are the palette the app has always used. */
        :root {
            color-scheme: light dark;
            --bg: #f5f6f8;
            --fg: #1c2330;
            --surface: #fff;
            --border: #e4e7ec;
            --muted: #98a2b3;
            --hover: #eef4ff;
            --success: #12b76a;
            --danger: #b42318;
            --danger-bg: #fee4e2;
            --toast-bg: #1c2330;
            --toast-fg: #fff;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #12161d;
                --fg: #e4e7ec;
                --surface: #1c2330;
                --border: #2c3444;
                --muted: #8794a8;
                --hover: #232d40;
                --success: #32d583;
                --danger: #fda29b;
                --danger-bg: #55160c;
                --toast-bg: #333d4f;
                --toast-fg: #f5f6f8;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding-top: 12px;
            padding-left: 24px;
            padding-right: 24px;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--fg);
        }

        #ibans {
            margin-bottom: 14px;
        }

        h2 {
            font-size: 14px;
            margin: 0 0 12px;
            text-align: center;
        }

        .columns {
            display: grid;
            grid-template-columns: repeat(5, minmax(max-content, 1fr));
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 8px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 16px;
        }

        /* A fit-content box centered with auto margins, rather than a full-width
           grid with justify-content: center — the latter makes the left overflow
           unreachable once the row is wider than the viewport. */
        .sections-row {
            display: grid;
            grid-template-columns: repeat(4, max-content);
            gap: 10px;
            width: fit-content;
            max-width: 100%;
            margin: 0 auto;
            overflow-x: auto;
            padding-bottom: 8px;
        }

        .sections-row .card {
            padding-left: 32px;
            padding-right: 32px;
        }

        .country-header {
            height: 32px;
            text-align: center;
            margin-bottom: 4px;
        }

        .flag {
            display: block;
            font-size: 24px;
            line-height: 1.2;
        }

        .country-select {
            width: 100%;
            height: 100%;
            padding: 4px 6px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--surface);
            font-size: 13px;
            color: inherit;
        }

        .group-title {
            margin: 10px 0 4px;
            text-align: center;
            font-size: 10.5px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--muted);
        }

        .value {
            display: block;
            position: relative;
            width: fit-content;
            margin: 0 auto;
            padding: 3px 0;
            border-radius: 4px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
            transition: background-color 0.15s, color 0.15s;
        }

        .value:hover {
            background: var(--hover);
        }

        .value.copied {
            color: var(--muted);
        }

        .value.copied::after {
            content: "✓";
            position: absolute;
            left: calc(100% + 6px);
            color: var(--success);
        }

        .value.invalid {
            background: var(--danger-bg);
            color: var(--danger);
        }

        /* Label column plus input column, so every input shares one left edge
           however long its label is. */
        .validator-grid {
            display: grid;
            grid-template-columns: max-content max-content;
            align-items: center;
            gap: 8px 10px;
        }

        /* Reuses .group-title's type tokens; declared after it so the centering
           and vertical margins it sets for stacked titles are overridden here. */
        .validator-label {
            margin: 0;
            text-align: right;
        }

        .validator-field {
            position: relative;
            width: fit-content;
        }

        /* Wide enough for the longest IBAN in the registry (RU, 33 characters);
           box-sizing is border-box, so padding and borders are added back on. */
        .validator-input {
            width: calc(33ch + 18px);
            padding: 6px 8px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--surface);
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 14px;
            color: inherit;
            transition: border-color 0.15s;
        }

        .validator-input.valid {
            border-color: var(--success);
        }

        .validator-input.invalid {
            border-color: var(--danger);
        }

        /* The verdict glyph, drawn the same way as the copy indicator: anchored
           outside the input so appearing never shifts the field. */
        .validator-status {
            position: absolute;
            top: 50%;
            left: calc(100% + 6px);
            transform: translateY(-50%);
            font-size: 14px;
            line-height: 1;
        }

        .validator-input.valid + .validator-status::after {
            content: "✓";
            color: var(--success);
        }

        .validator-input.invalid + .validator-status::after {
            content: "✗";
            color: var(--danger);
        }

        #toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translate(-50%, 8px);
            padding: 8px 14px;
            border-radius: 6px;
            background: var(--toast-bg);
            color: var(--toast-fg);
            font-size: 12.5px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s, transform 0.2s;
        }

        #toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }
    </style>
</head>

<body>
    <section id="ibans">
        <h2>IBANs</h2>
        <div class="columns" id="iban-grid"></div>
    </section>

    <div class="sections-row">
        <section id="qr-ibans">
            <h2>QR-IBANs</h2>
            <div class="card" id="qr-iban-list"></div>
        </section>

        <section id="qr-references">
            <h2>QR references</h2>
            <div class="card" id="qr-list"></div>
        </section>

        <section id="scor-references">
            <h2>SCOR references</h2>
            <div class="card" id="scor-list"></div>
        </section>

        <section id="validators">
            <h2>Validators</h2>
            <div class="card" id="validator-list"></div>
        </section>
    </div>

    <div id="toast"></div>

    <script>
        "use strict";

        // --- random helpers ---

        const IBANS_PER_GROUP = 5;
        const REFS_PER_GROUP = 5;
        const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

        const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
        const randDigits = (n) => Array.from({ length: n }, () => randInt(0, 9)).join("");
        const randLetter = () => LETTERS[randInt(0, 25)];
        const randAlnum = () => ("0123456789" + LETTERS)[randInt(0, 35)];
        const randLetters = (n) => Array.from({ length: n }, randLetter).join("");
        const pick = (list) => list[randInt(0, list.length - 1)];
        // 0x1f1a5 = regional indicator "A" (0x1f1e6) minus "A".charCodeAt(0), so each
        // letter maps to its flag-emoji code point.
        const flagOf = (code) => String.fromCodePoint(...[...code].map((c) => 0x1f1a5 + c.charCodeAt(0)));

        // --- IBAN building blocks ---

        // ISO 7064 mod 97-10 over an alphanumeric string (A=10 ... Z=35).
        function mod97(input) {
            let rem = 0;
            for (const ch of input) {
                const expanded = ch >= "0" && ch <= "9" ? ch : String(ch.charCodeAt(0) - 55);
                for (const d of expanded) rem = (rem * 10 + (d.charCodeAt(0) - 48)) % 97;
            }
            return rem;
        }

        function withCheckDigits(country, bban) {
            const check = 98 - mod97(bban + country + "00");
            return country + String(check).padStart(2, "0") + bban;
        }

        // QR-IIDs are 30000-31999 (Swiss QR-bill spec): a QR-IBAN is a CH IBAN whose
        // IID falls in that range. Normal CH IBANs explicitly avoid it so the two
        // groups never overlap.
        const QR_IID_MIN = 30000;
        const QR_IID_MAX = 31999;

        function isQrLike(code) {
            const headLen = Math.min(code.length, 5);
            const head = Number(code.slice(0, headLen));
            const scale = 10 ** (5 - headLen);
            return head >= Math.floor(QR_IID_MIN / scale) && head <= Math.floor(QR_IID_MAX / scale);
        }

        function numericCode(length, qr) {
            if (qr) {
                const iid = String(randInt(QR_IID_MIN, QR_IID_MAX));
                return length <= 5 ? iid.slice(0, length) : iid + randDigits(length - 5);
            }
            let code;
            do {
                code = randDigits(length);
            } while (isQrLike(code));
            return code;
        }

        // --- national check digits ---

        // French RIB key: bank || branch || account || key must be ≡ 0 (mod 97).
        function frRibKey(bank, branch, account) {
            const rem = (89n * BigInt(bank) + 15n * BigInt(branch) + 3n * BigInt(account)) % 97n;
            return String(97 - Number(rem)).padStart(2, "0");
        }

        // Spanish dígito de control over a 10-digit block.
        function esCheckDigit(digits) {
            const weights = [1, 2, 4, 8, 5, 10, 9, 7, 3, 6];
            let sum = 0;
            for (let i = 0; i < 10; i++) sum += Number(digits[i]) * weights[i];
            const r = 11 - (sum % 11);
            return r === 11 ? 0 : r === 10 ? 1 : r;
        }

        const esControl = (bank, branch, account) =>
            `${esCheckDigit("00" + bank + branch)}${esCheckDigit(account)}`;

        // Italian CIN over ABI + CAB + account (22 digits).
        const IT_CIN_ODD = [1, 0, 5, 7, 9, 13, 15, 17, 19, 21];

        function itCin(digits) {
            let sum = 0;
            for (let i = 0; i < 22; i++) {
                const d = Number(digits[i]);
                sum += i % 2 === 0 ? IT_CIN_ODD[d] : d;
            }
            return String.fromCharCode(65 + (sum % 26));
        }

        // National check digits for every registry country that defines a scheme.
        // Each entry rewrites a randomly generated BBAN's check digits (fix) and
        // verifies them (ok); all algorithms are anchored on the official registry
        // example IBANs in test.mjs. Countries not listed have no national scheme
        // (or, like DE, a per-bank one that cannot be implemented generically).

        const wsumL = (s, w) => [...s].reduce((sum, ch, i) => sum + Number(ch) * w[i % w.length], 0);
        const wsumR = (s, w) => wsumL([...s].reverse().join(""), w);
        const mod10w = (s, w) => (10 - (wsumL(s, w) % 10)) % 10;
        const setAt = (s, i, ch) => s.slice(0, i) + ch + s.slice(i + 1);

        // Luhn (FI): double every second digit from the right.
        function luhnCheckDigit(digits) {
            let sum = 0;
            [...digits].reverse().forEach((ch, i) => {
                let d = Number(ch);
                if (i % 2 === 0) {
                    d *= 2;
                    if (d > 9) d -= 9;
                }
                sum += d;
            });
            return (10 - (sum % 10)) % 10;
        }

        // ISO 7064 MOD 11,10 (HR).
        function mod1110CheckDigit(digits) {
            let p = 10;
            for (const ch of digits) {
                p = (p + Number(ch)) % 10 || 10;
                p = (p * 2) % 11;
            }
            return (11 - p) % 10;
        }

        // MOD 11 field whose last digit has weight 1 (CZ/SK): a required check
        // digit of 10 is impossible, so reroll the body until it fits.
        function mod11Field(length, weights) {
            let body, check;
            do {
                body = randDigits(length - 1);
                check = (11 - (wsumL(body, weights) % 11)) % 11;
            } while (check === 10);
            return body + check;
        }

        // BBAN ≡ 1 (mod 97), ISO 7064 MOD 97-10: PT, RS, ME, MK, BA, TL, SI, ST, XK.
        const fix9710 = (bban) => bban.slice(0, -2) + String(98 - mod97(bban.slice(0, -2) + "00")).padStart(2, "0");
        const ok9710 = (bban) => mod97(bban) === 1;

        // BBAN ≡ 0 (mod 97), French RIB key family: FR, MC, MR, TN, BI, DJ. Digits only —
        // the RIB letter-to-digit table is not implemented since we never generate
        // letters in these accounts.
        const fixRib = (bban) => bban.slice(0, -2) + String(97 - mod97(bban.slice(0, -2) + "00")).padStart(2, "0");
        const okRib = (bban) => mod97(bban) === 0;

        const fixItCin = (bban) => itCin(bban.slice(1)) + bban.slice(1);
        const okItCin = (bban) => bban[0] === itCin(bban.slice(1));

        const czskNational = {
            fix: (b) => b.slice(0, 4) + mod11Field(6, [10, 5, 8, 4, 2]) + mod11Field(10, [6, 3, 7, 9, 10, 5, 8, 4, 2]),
            ok: (b) => wsumL(b.slice(4, 10), [10, 5, 8, 4, 2, 1]) % 11 === 0
                && wsumL(b.slice(10), [6, 3, 7, 9, 10, 5, 8, 4, 2, 1]) % 11 === 0,
        };

        const NO_WEIGHTS = [5, 4, 3, 2, 7, 6, 5, 4, 3, 2];
        const IS_WEIGHTS = [3, 2, 7, 6, 5, 4, 3, 2];

        const NATIONAL = {
            FR: { fix: fixRib, ok: okRib },
            MC: { fix: fixRib, ok: okRib },
            MR: { fix: fixRib, ok: okRib },
            TN: { fix: fixRib, ok: okRib },
            BI: { fix: fixRib, ok: okRib },
            DJ: { fix: fixRib, ok: okRib },
            PT: { fix: fix9710, ok: ok9710 },
            RS: { fix: fix9710, ok: ok9710 },
            ME: { fix: fix9710, ok: ok9710 },
            MK: { fix: fix9710, ok: ok9710 },
            BA: { fix: fix9710, ok: ok9710 },
            TL: { fix: fix9710, ok: ok9710 },
            SI: { fix: fix9710, ok: ok9710 },
            ST: { fix: fix9710, ok: ok9710 },
            XK: { fix: fix9710, ok: ok9710 },
            IT: { fix: fixItCin, ok: okItCin },
            SM: { fix: fixItCin, ok: okItCin },
            CZ: czskNational,
            SK: czskNational,
            ES: {
                fix: (b) => b.slice(0, 8) + esControl(b.slice(0, 4), b.slice(4, 8), b.slice(10)) + b.slice(10),
                ok: (b) => b.slice(8, 10) === esControl(b.slice(0, 4), b.slice(4, 8), b.slice(10)),
            },
            BE: {
                // last two digits = first ten as a number mod 97 (0 becomes 97)
                fix: (b) => b.slice(0, 10) + String(mod97(b.slice(0, 10)) || 97).padStart(2, "0"),
                ok: (b) => b.slice(10) === String(mod97(b.slice(0, 10)) || 97).padStart(2, "0"),
            },
            NO: {
                fix(b) {
                    let body = b.slice(0, 10);
                    let check;
                    while ((check = (11 - (wsumL(body, NO_WEIGHTS) % 11)) % 11) === 10) body = randDigits(10);
                    return body + check;
                },
                ok: (b) => Number(b[10]) === (11 - (wsumL(b.slice(0, 10), NO_WEIGHTS) % 11)) % 11,
            },
            FI: {
                fix: (b) => b.slice(0, 13) + luhnCheckDigit(b.slice(0, 13)),
                ok: (b) => Number(b[13]) === luhnCheckDigit(b.slice(0, 13)),
            },
            EE: {
                // weights 7,3,1 from the right over branch + account (digits 2..14)
                fix: (b) => b.slice(0, 15) + String((10 - (wsumR(b.slice(2, 15), [7, 3, 1]) % 10)) % 10),
                ok: (b) => Number(b[15]) === (10 - (wsumR(b.slice(2, 15), [7, 3, 1]) % 10)) % 10,
            },
            PL: {
                fix: (b) => setAt(b, 7, mod10w(b.slice(0, 7), [3, 9, 7, 1, 3, 9, 7])),
                ok: (b) => Number(b[7]) === mod10w(b.slice(0, 7), [3, 9, 7, 1, 3, 9, 7]),
            },
            AL: {
                fix: (b) => setAt(b, 7, mod10w(b.slice(0, 7), [9, 7, 3, 1])),
                ok: (b) => Number(b[7]) === mod10w(b.slice(0, 7), [9, 7, 3, 1]),
            },
            HU: {
                fix: (b) => setAt(setAt(b, 7, mod10w(b.slice(0, 7), [9, 7, 3, 1])), 23, mod10w(b.slice(8, 23), [9, 7, 3, 1])),
                ok: (b) => Number(b[7]) === mod10w(b.slice(0, 7), [9, 7, 3, 1])
                    && Number(b[23]) === mod10w(b.slice(8, 23), [9, 7, 3, 1]),
            },
            HR: {
                fix: (b) => b.slice(0, 6) + mod1110CheckDigit(b.slice(0, 6)) + b.slice(7, 16) + mod1110CheckDigit(b.slice(7, 16)),
                ok: (b) => Number(b[6]) === mod1110CheckDigit(b.slice(0, 6))
                    && Number(b[16]) === mod1110CheckDigit(b.slice(7, 16)),
            },
            IS: {
                // last 10 digits are a kennitala: DDMMYY + 2 digits + mod-11 check
                // digit + century digit (8, 9 or 0)
                fix(b) {
                    const date = String(randInt(1, 28)).padStart(2, "0") + String(randInt(1, 12)).padStart(2, "0") + randDigits(2);
                    let head, check;
                    do {
                        head = date + randDigits(2);
                        check = (11 - (wsumL(head, IS_WEIGHTS) % 11)) % 11;
                    } while (check === 10);
                    return b.slice(0, 12) + head + check + pick("089");
                },
                ok(b) {
                    const kennitala = b.slice(12);
                    return Number(kennitala[8]) === (11 - (wsumL(kennitala.slice(0, 8), IS_WEIGHTS) % 11)) % 11
                        && "089".includes(kennitala[9]);
                },
            },
        };

        // --- per-country generators (formats per the official IBAN registry) ---

        const GB_BANK_CODES = ["BARC", "NWBK", "LOYD", "HBUK", "MIDL", "ABBY", "RBOS", "BUKB", "HLFX", "CITI"];

        const countries = [
            {
                code: "CH", name: "Switzerland",
                gen(qr) {
                    return withCheckDigits("CH", numericCode(5, qr) + randDigits(12));
                },
            },
            {
                code: "FR", name: "France",
                gen() {
                    const bank = randDigits(5);
                    const branch = randDigits(5);
                    const account = randDigits(11);
                    return withCheckDigits("FR", bank + branch + account + frRibKey(bank, branch, account));
                },
            },
            {
                code: "DE", name: "Germany",
                gen() {
                    return withCheckDigits("DE", randDigits(8) + randDigits(10));
                },
            },
            {
                code: "IT", name: "Italy",
                gen() {
                    const bban = randDigits(5) + randDigits(5) + randDigits(12);
                    return withCheckDigits("IT", itCin(bban) + bban);
                },
            },
            {
                code: "ES", name: "Spain",
                gen() {
                    const bank = randDigits(4);
                    const branch = randDigits(4);
                    const account = randDigits(10);
                    return withCheckDigits("ES", bank + branch + esControl(bank, branch, account) + account);
                },
            },
            {
                code: "BR", name: "Brazil",
                gen() {
                    return withCheckDigits("BR", randDigits(8) + randDigits(5) + randDigits(10) + randLetter() + randAlnum());
                },
            },
            {
                code: "TR", name: "Turkey",
                gen() {
                    return withCheckDigits("TR", randDigits(5) + "0" + randDigits(16));
                },
            },
            {
                code: "AE", name: "United Arab Emirates",
                gen() {
                    return withCheckDigits("AE", randDigits(3) + randDigits(16));
                },
            },
            {
                code: "GB", name: "United Kingdom",
                gen() {
                    return withCheckDigits("GB", pick(GB_BANK_CODES) + randDigits(6) + randDigits(8));
                },
            },
        ];

        // --- generic generator (any IBAN country) ---

        // All countries in the SWIFT IBAN registry: [code, name, BBAN spec]. Spec
        // segments are <length><type> with n = digits, a = letters, c = alphanumeric
        // (generated as digits here). Countries with a dedicated generator above are
        // routed through it; the rest get random digits whose national check digits,
        // where the country defines a scheme, are corrected afterwards (see NATIONAL).
        const IBAN_REGISTRY = [
            ["AD", "Andorra", "4n4n12c"],
            ["AE", "United Arab Emirates", "3n16n"],
            ["AL", "Albania", "8n16c"],
            ["AT", "Austria", "5n11n"],
            ["AZ", "Azerbaijan", "4a20c"],
            ["BA", "Bosnia and Herzegovina", "3n3n8n2n"],
            ["BE", "Belgium", "3n7n2n"],
            ["BG", "Bulgaria", "4a4n2n8c"],
            ["BH", "Bahrain", "4a14c"],
            ["BI", "Burundi", "5n5n11n2n"],
            ["BR", "Brazil", "8n5n10n1a1c"],
            ["BY", "Belarus", "4c4n16c"],
            ["CH", "Switzerland", "5n12c"],
            ["CR", "Costa Rica", "4n14n"],
            ["CY", "Cyprus", "3n5n16c"],
            ["CZ", "Czech Republic", "4n6n10n"],
            ["DE", "Germany", "8n10n"],
            ["DJ", "Djibouti", "5n5n11n2n"],
            ["DK", "Denmark", "4n9n1n"],
            ["DO", "Dominican Republic", "4c20n"],
            ["EE", "Estonia", "2n2n11n1n"],
            ["EG", "Egypt", "4n4n17n"],
            ["ES", "Spain", "4n4n2n10n"],
            ["FI", "Finland", "3n11n"],
            ["FK", "Falkland Islands", "2a12n"],
            ["FO", "Faroe Islands", "4n9n1n"],
            ["FR", "France", "5n5n11c2n"],
            ["GB", "United Kingdom", "4a6n8n"],
            ["GE", "Georgia", "2a16n"],
            ["GI", "Gibraltar", "4a15c"],
            ["GL", "Greenland", "4n9n1n"],
            ["GR", "Greece", "3n4n16c"],
            ["GT", "Guatemala", "4c20c"],
            ["HN", "Honduras", "4a20n"],
            ["HR", "Croatia", "7n10n"],
            ["HU", "Hungary", "3n4n1n15n1n"],
            ["IE", "Ireland", "4a6n8n"],
            ["IL", "Israel", "3n3n13n"],
            ["IQ", "Iraq", "4a3n12n"],
            ["IS", "Iceland", "4n2n6n10n"],
            ["IT", "Italy", "1a5n5n12c"],
            ["JO", "Jordan", "4a4n18c"],
            ["KW", "Kuwait", "4a22c"],
            ["KZ", "Kazakhstan", "3n13c"],
            ["LB", "Lebanon", "4n20c"],
            ["LC", "Saint Lucia", "4a24c"],
            ["LI", "Liechtenstein", "5n12c"],
            ["LT", "Lithuania", "5n11n"],
            ["LU", "Luxembourg", "3n13c"],
            ["LV", "Latvia", "4a13c"],
            ["LY", "Libya", "3n3n15n"],
            ["MC", "Monaco", "5n5n11c2n"],
            ["MD", "Moldova", "2c18c"],
            ["ME", "Montenegro", "3n13n2n"],
            ["MK", "North Macedonia", "3n10c2n"],
            ["MN", "Mongolia", "4n12n"],
            ["MR", "Mauritania", "5n5n11n2n"],
            ["MT", "Malta", "4a5n18c"],
            ["MU", "Mauritius", "4a2n2n12n3n3a"],
            ["NI", "Nicaragua", "4a20n"],
            ["NL", "Netherlands", "4a10n"],
            ["NO", "Norway", "4n6n1n"],
            ["OM", "Oman", "3n16c"],
            ["PK", "Pakistan", "4a16c"],
            ["PL", "Poland", "8n16n"],
            ["PS", "Palestine", "4a21c"],
            ["PT", "Portugal", "4n4n11n2n"],
            ["QA", "Qatar", "4a21c"],
            ["RO", "Romania", "4a16c"],
            ["RS", "Serbia", "3n13n2n"],
            ["RU", "Russia", "9n5n15c"],
            ["SA", "Saudi Arabia", "2n18c"],
            ["SC", "Seychelles", "4a2n2n16n3a"],
            ["SD", "Sudan", "2n12n"],
            ["SE", "Sweden", "3n16n1n"],
            ["SI", "Slovenia", "5n8n2n"],
            ["SK", "Slovakia", "4n6n10n"],
            ["SM", "San Marino", "1a5n5n12c"],
            ["SO", "Somalia", "4n3n12n"],
            ["ST", "São Tomé and Príncipe", "8n11n2n"],
            ["SV", "El Salvador", "4a20n"],
            ["TL", "Timor-Leste", "3n14n2n"],
            ["TN", "Tunisia", "2n3n13n2n"],
            ["TR", "Turkey", "5n1n16c"],
            ["UA", "Ukraine", "6n19c"],
            ["VA", "Vatican City", "3n15n"],
            ["VG", "British Virgin Islands", "4a16n"],
            ["XK", "Kosovo", "4n10n2n"],
            ["YE", "Yemen", "4a4n18c"],
        ];

        function genericIban(code) {
            const fixed = countries.find((country) => country.code === code);
            if (fixed) return fixed.gen();
            const spec = IBAN_REGISTRY.find((entry) => entry[0] === code)[2];
            let bban = "";
            for (const [, count, type] of spec.matchAll(/(\d+)([nac])/g)) {
                bban += type === "a" ? randLetters(Number(count)) : randDigits(Number(count));
            }
            // LI shares the Swiss QR-IID system, so keep its IBANs out of the QR range
            if (code === "LI") bban = numericCode(5, false) + bban.slice(5);
            const national = NATIONAL[code];
            if (national) bban = national.fix(bban);
            return withCheckDigits(code, bban);
        }

        // --- BIC / SWIFT codes ---

        // ISO 9362: 4!a bank code + 2!a country + 2!c location + optional 3!c branch.
        // The location code avoids 0 and 1 (test / not-connected markers) and, in its
        // second character, the letter O (SWIFT rule); a branch other than the
        // head-office "XXX" must not start with X.
        const BIC_LOCATION1_CHARS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ23456789";
        const BIC_LOCATION2_CHARS = "ABCDEFGHIJKLMNPQRSTUVWXYZ23456789";
        const BIC_BRANCH_FIRST_CHARS = "0123456789ABCDEFGHIJKLMNOPQRSTUVWYZ";

        function genBic(countryCode) {
            const location = pick(BIC_LOCATION1_CHARS) + pick(BIC_LOCATION2_CHARS);
            const roll = randInt(0, 3);
            const branch =
                roll <= 1 ? "" : roll === 2 ? "XXX" : pick(BIC_BRANCH_FIRST_CHARS) + randAlnum() + randAlnum();
            return randLetters(4) + countryCode + location + branch;
        }

        // --- payment references ---

        // Swiss QR reference: 26 random digits + recursive mod-10 check digit.
        const MOD10_TABLE = [0, 9, 4, 6, 8, 2, 7, 1, 3, 5];

        function mod10CheckDigit(digits) {
            let carry = 0;
            for (const d of digits) carry = MOD10_TABLE[(carry + d.charCodeAt(0) - 48) % 10];
            return String((10 - carry) % 10);
        }

        function genQrReference() {
            const body = randDigits(26);
            return body + mod10CheckDigit(body);
        }

        // SCOR / ISO 11649 creditor reference: "RF" + mod-97 check digits + body
        // (5-21 digits here; the spec allows up to 21 alphanumeric characters).
        function genScorReference() {
            const body = randDigits(randInt(5, 21));
            return "RF" + String(98 - mod97(body + "RF00")).padStart(2, "0") + body;
        }

        // --- validators ---

        // Every rendered value is checked against the strictest validation available:
        // the backend's regexes (QR-IBAN, BIC), the IBAN registry (structure, length)
        // and the relevant checksums. Failures are logged and flagged red.

        const QR_IBAN_REGEX = /^(CH|LI)[0-9]{2}3[01][0-9]{3}[A-Z0-9]{12}$/;
        const BIC_REGEX = /^[A-Z]{4}[A-Z]{2}[A-Z2-9][A-NP-Z0-9](XXX|[A-WYZ0-9][A-Z0-9]{2})?$/;

        function isValidIban(iban) {
            const entry = IBAN_REGISTRY.find((e) => e[0] === iban.slice(0, 2));
            if (!entry) return false;
            let pattern = `^${entry[0]}[0-9]{2}`;
            for (const [, count, type] of entry[2].matchAll(/(\d+)([nac])/g)) {
                pattern += (type === "a" ? "[A-Z]" : type === "n" ? "[0-9]" : "[A-Z0-9]") + `{${count}}`;
            }
            if (!new RegExp(pattern + "$").test(iban)) return false;
            // ISO 13616 check digits live in 02..98; 00, 01 and 99 are mod-97 twins
            // of canonical values and pass the checksum, so reject them explicitly.
            if (["00", "01", "99"].includes(iban.slice(2, 4))) return false;
            if (mod97(iban.slice(4) + iban.slice(0, 4)) !== 1) return false;
            const national = NATIONAL[iban.slice(0, 2)];
            return national ? national.ok(iban.slice(4)) : true;
        }

        const isValidNormalIban = (iban) => isValidIban(iban) && !QR_IBAN_REGEX.test(iban);
        const isValidQrIban = (iban) => isValidIban(iban) && QR_IBAN_REGEX.test(iban);
        const isValidBic = (bic, countryCode) => BIC_REGEX.test(bic) && bic.slice(4, 6) === countryCode;

        const isValidQrReference = (ref) =>
            /^[0-9]{27}$/.test(ref) && ref[26] === mod10CheckDigit(ref.slice(0, 26));

        const isValidScorReference = (ref) =>
            /^RF(?!0[01]|99)[0-9]{2}[A-Z0-9]{1,21}$/.test(ref) && mod97(ref.slice(4) + ref.slice(0, 4)) === 1;

        // --- validator inputs ---

        // IBAN, QR and SCOR references are printed grouped in blocks of digits, so
        // a pasted value is validated as a whitespace-free, uppercased copy while
        // the field keeps whatever was typed.
        const normalize = (value) => value.replace(/\s/g, "").toUpperCase();

        const VALIDATOR_FIELDS = [
            // A QR-IBAN is a structurally valid CH/LI IBAN, so it passes here too;
            // the field below is the one that tells the two apart.
            { id: "v-iban", label: "IBAN", isValid: isValidIban },
            { id: "v-qr-iban", label: "QR-IBAN", isValid: isValidQrIban },
            // No country is known for a pasted BIC, so only the ISO 9362 structure
            // is checked — the country code is not verified against a country list.
            { id: "v-bic", label: "BIC/SWIFT", isValid: (bic) => BIC_REGEX.test(bic) },
            { id: "v-qr-reference", label: "QR reference", isValid: isValidQrReference },
            { id: "v-scor-reference", label: "SCOR reference", isValid: isValidScorReference },
        ];

        function validatorFieldsHtml() {
            const rows = VALIDATOR_FIELDS.map(
                ({ id, label }) => `
        <label class="group-title validator-label" for="${id}">${label}</label>
        <div class="validator-field">
          <input id="${id}" class="validator-input" type="text" spellcheck="false"
            autocomplete="off" autocapitalize="off">
          <span class="validator-status" aria-hidden="true"></span>
        </div>`
            ).join("");
            return `<div class="validator-grid">${rows}\n      </div>`;
        }

        // An empty field has no verdict: neutral border, no marker.
        function validateField(input, isValid) {
            const value = normalize(input.value);
            const valid = value === "" ? null : isValid(value);
            input.classList.toggle("valid", valid === true);
            input.classList.toggle("invalid", valid === false);
            if (valid === null) input.removeAttribute("aria-invalid");
            else input.setAttribute("aria-invalid", String(!valid));
        }

        // --- rendering ---

        function valueHtml(value, isValid) {
            const valid = isValid(value);
            if (!valid) console.error("Generated an invalid value:", value);
            return `<code class="value${valid ? "" : " invalid"}">${value}</code>`;
        }

        function render() {
            const values = (country, qr) =>
                Array.from({ length: IBANS_PER_GROUP }, () => valueHtml(country.gen(qr), qr ? isValidQrIban : isValidNormalIban)).join("");

            const bics = (country) =>
                Array.from({ length: IBANS_PER_GROUP }, () => valueHtml(genBic(country.code), (bic) => isValidBic(bic, country.code))).join("");

            document.getElementById("iban-grid").innerHTML = countries
                .map(
                    (country) => `
      <div class="card">
        <div class="country-header">
          <span class="flag">${flagOf(country.code)}</span>
        </div>
        <div class="group-title">IBAN</div>
        ${values(country, false)}
        <div class="group-title">BIC/SWIFT</div>
        ${bics(country)}
      </div>`
                )
                .join("") + genericCardHtml();

            document.getElementById("qr-iban-list").innerHTML =
                values(countries.find((country) => country.code === "CH"), true);

            // Longest first. SCOR reference bodies vary in length; QR references
            // are always 27 digits, so for those the sort is a no-op (it is
            // stable, so they keep the order they were generated in).
            const refs = (gen, isValid) =>
                Array.from({ length: REFS_PER_GROUP }, () => gen())
                    .sort((a, b) => b.length - a.length)
                    .map((ref) => valueHtml(ref, isValid))
                    .join("");

            document.getElementById("qr-list").innerHTML = refs(genQrReference, isValidQrReference);
            document.getElementById("scor-list").innerHTML = refs(genScorReference, isValidScorReference);
            document.getElementById("validator-list").innerHTML = validatorFieldsHtml();
        }

        function genericCardHtml() {
            const options = [...IBAN_REGISTRY]
                .sort((a, b) => a[1].localeCompare(b[1]))
                .map(([code, name]) => `<option value="${code}">${flagOf(code)} ${name}</option>`)
                .join("");
            return `
      <div class="card">
        <div class="country-header">
          <select id="country-select" class="country-select">
            <option value="" selected disabled>Select a country…</option>
            ${options}
          </select>
        </div>
        <div id="generic-ibans"></div>
      </div>`;
        }

        function renderGenericIbans(code) {
            const items = (gen, isValid) =>
                Array.from({ length: IBANS_PER_GROUP }, () => valueHtml(gen(), isValid)).join("");
            document.getElementById("generic-ibans").innerHTML =
                `<div class="group-title">IBAN</div>` + items(() => genericIban(code), isValidNormalIban) +
                `<div class="group-title">BIC/SWIFT</div>` + items(() => genBic(code), (bic) => isValidBic(bic, code));
        }

        async function copyText(text) {
            try {
                await navigator.clipboard.writeText(text);
            } catch {
                const textarea = document.createElement("textarea");
                textarea.value = text;
                textarea.style.cssText = "position: fixed; opacity: 0";
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand("copy");
                textarea.remove();
            }
        }

        let toastTimer;
        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.textContent = message;
            toast.classList.add("show");
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove("show"), 1500);
        }

        if (typeof document !== "undefined") {
            render();
            document.body.addEventListener("click", (event) => {
                const value = event.target.closest("code.value");
                if (!value) return;
                copyText(value.textContent);
                showToast("Copied");
                value.classList.add("copied");
            });
            document.body.addEventListener("change", (event) => {
                if (event.target.id === "country-select") renderGenericIbans(event.target.value);
            });
            document.body.addEventListener("input", (event) => {
                const field = VALIDATOR_FIELDS.find((entry) => entry.id === event.target.id);
                if (field) validateField(event.target, field.isValid);
            });
        }
    </script>
</body>

</html>
